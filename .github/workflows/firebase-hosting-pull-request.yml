# Deploy to Firebase Hosting Preview Channel on every Pull Request
# Generated by Antigravity CI/CD Agent — github.com/NiranjanSaravanakumar/MyPortfolio

name: Deploy to Firebase Hosting (PR Preview)

on:
  pull_request:
    branches:
      - main

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    name: Build & Preview
    runs-on: ubuntu-latest
    # Only run on PRs from the same repo (not forks) to protect secrets
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build

      - name: Deploy PR preview to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NIRANJAN_PORTFOLIO_2026 }}
          projectId: niranjan-portfolio-2026
          entryPoint: '.'
