# Deploy to Firebase Hosting on every push to `main`
# Generated by Antigravity CI/CD Agent — github.com/NiranjanSaravanakumar/MyPortfolio

name: Deploy to Firebase Hosting (Production)

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NIRANJAN_PORTFOLIO_2026 }}
          channelId: live
          projectId: niranjan-portfolio-2026
          entryPoint: '.'
